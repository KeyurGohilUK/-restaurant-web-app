name: Format admin feature

on:
  push:
    branches:
      - feat/admin-content-management

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/admin-content-management
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: npm install
      - run: npm run format
      - name: Commit formatted files
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin.html src/admin.css src/admin.ts src/infrastructure/supabase-api.ts src/main.ts vite.config.ts .github/workflows/pages.yml docs/admin.md supabase/migrations/20260920_admin_content.sql
          git commit -m "Format admin content management"
          git push origin HEAD:feat/admin-content-management
