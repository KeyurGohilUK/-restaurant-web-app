name: P2 security bootstrap

on:
  push:
    branches:
      - chore/p2-security-hardening

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: chore/p2-security-hardening

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22

      - name: Upgrade Vitest and lockfile
        run: npm install --save-dev vitest@^5.0.1 --no-audit --no-fund

      - name: Apply safe DOM migration
        run: node scripts/apply-p2-hardening.mjs

      - name: Format changed files
        run: npx prettier --write package.json package-lock.json src/main.ts

      - name: Verify migration
        run: |
          npm run lint
          npm run typecheck
          npm test
          npm run build
          npm audit --audit-level=moderate

      - name: Commit generated changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json src/main.ts
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'chore: complete P2 code and dependency hardening'
          git push origin HEAD:chore/p2-security-hardening
